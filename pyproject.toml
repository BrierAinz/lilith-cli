[project]
name = "lilith-workspace"
version = "4.4.0"
description = "Lilith CLI — Norse-themed terminal IDE and agent interface (uv workspace)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["lilith-cli"]

[tool.uv.sources]
lilith-cli = { workspace = true }
lilith-tools = { workspace = true }

[tool.uv]
# pytest-textual-snapshot pins Syrupy 4.8.0 even though its public fixture
# remains compatible with Syrupy 5. Override that stale transitive pin so
# pytest can receive security fixes from the 9.x line.
override-dependencies = ["syrupy>=5.5.3"]

[tool.uv.workspace]
members = ["lilith-cli", "lilith-core", "lilith-skills", "lilith-orchestrator", "lilith-memory", "lilith-tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
target-version = "py311"
extend-exclude = ["lilith-cli/lilith_cli/web_console/frontend"]

[tool.ruff.lint]
# Pyflakes (unused/undefined names), bugbear and syntax errors. Style rules
# are left out on purpose: this gate is for defects, not formatting.
select = ["E9", "F", "B"]
ignore = [
    "B905",  # zip() without strict=: the default is intended in this codebase
]

[tool.ruff.lint.per-file-ignores]
# Facades re-export names on purpose.
"lilith-cli/lilith_cli/extra_commands.py" = ["F401"]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
