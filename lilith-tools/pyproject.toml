[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lilith-tools"
version = "1.4.0"
description = "PC control, browser automation, RAG tools"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "lilith-core",
    "lilith-memory",
    "mcp>=1.28.1",
    "requests",
]

[project.urls]
Repository = "https://github.com/BrierAinz/lilith-cli"

[tool.uv.sources]
lilith-core = { workspace = true }
lilith-memory = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["lilith_tools"]
